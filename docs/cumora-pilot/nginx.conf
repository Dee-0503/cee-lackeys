server {
    listen 80;
    server_name lackeys.ceee.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /home/cee/apps/cumora-pilot/acme;
    }
    location / { return 301 https://lackeys.ceee.cloud$request_uri; }
}
server {
    listen 443 ssl;
    server_name lackeys.ceee.cloud;
    ssl_certificate /etc/letsencrypt/live/lackeys.ceee.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lackeys.ceee.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/cumora-pilot-access.log;
    error_log /var/log/nginx/cumora-pilot-error.log;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:15181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
